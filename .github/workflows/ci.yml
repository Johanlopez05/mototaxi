name: CI

# En cada push a cualquier rama; los PR muestran los resultados del último commit
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Tipos, lint y pruebas de shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w @mototaxi/shared
      # next queda en apps/panel/node_modules y eslint-config-next en la raíz (ver CLAUDE.md)
      - run: npm run lint -w @mototaxi/panel
        env:
          NODE_PATH: ${{ github.workspace }}/apps/panel/node_modules
      - run: npm run build -w @mototaxi/panel
        env:
          NEXT_TELEMETRY_DISABLED: 1

  db:
    name: Base de datos (Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: DENO_NO_PACKAGE_JSON=1 deno test
        working-directory: supabase/functions
      - run: DENO_NO_PACKAGE_JSON=1 deno check */index.ts
        working-directory: supabase/functions
